name: Update BTC Signal Pro Data

on:
  schedule:
    - cron: '5 0 * * *'  # Daily at 00:05 UTC (08:05 Beijing)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # 1. BTC OHLCV (JLST depends on this)
      - name: Update BTC historical CSV
        run: python scripts/update_btc_csv.py

      # 2. On-chain (MVRV, realized price, NUPL)
      - name: Update on-chain data
        env:
          CRYPTOQUANT_KEY: ${{ secrets.CRYPTOQUANT_KEY }}
        run: python scripts/update_onchain.py

      # 3. ETF flow
      - name: Update ETF flow
        run: python scripts/update_etf.py

      # 4. BTC/AAPL
      - name: Update BTC/AAPL ratio
        run: python scripts/update_btc_aapl.py

      # 5. Dominance
      - name: Update dominance
        run: python scripts/update_dominance.py

      # 6. URPD
      - name: Update URPD
        env:
          CRYPTOQUANT_KEY: ${{ secrets.CRYPTOQUANT_KEY }}
        run: python scripts/update_urpd.py

      # 7. JLST v2 signals + multi-signal logic (depends on btc_historical.csv)
      - name: Run JLST data pipeline
        run: python scripts/update_jlst.py

      # 8. Commit & push
      - name: Commit and push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "data: auto-update $(date -u +%Y-%m-%d)"
          git push
